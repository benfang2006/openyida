<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenYida Eval 控制台</title>
<style>
  /* 默认:暖色咖啡（浅色）。深色咖啡见 [data-theme="dark"]。 */
  :root {
    --bg: #efe6d8; --bg2: #e7dccb; --panel: #fbf6ee; --panel2: #f2e9da;
    --border: #e0d2bd; --border2: #d0bca0; --fg: #3a2e26; --muted: #8d7b69;
    --accent: #9c6b43; --accent2: #c79a68; --ok: #5f8a4f; --fail: #c1543b;
    --warn: #bd862f; --danger: #b15a35;
    --ok-bg: rgba(95,138,79,.14); --danger-bg: rgba(177,90,53,.15); --accent-bg: rgba(156,107,67,.13);
    --bg-grad: radial-gradient(1200px 600px at 80% -10%, #f7efe2 0%, var(--bg) 55%);
    --header-bg: rgba(247,239,226,.7); --scroll: rgba(141,123,105,.4); --scroll-hover: rgba(141,123,105,.62);
    --shadow: 0 6px 22px rgba(120,84,52,.14);
  }
  :root[data-theme="dark"] {
    --bg: #1c1613; --bg2: #241b16; --panel: #2b211b; --panel2: #342720;
    --border: #3d2e25; --border2: #4f3b2e; --fg: #f0e6da; --muted: #b39d88;
    --accent: #c08a5a; --accent2: #dab285; --ok: #7fb069; --fail: #e07a5f;
    --warn: #dba35a; --danger: #d98a5f;
    --ok-bg: rgba(127,176,105,.16); --danger-bg: rgba(217,138,95,.18); --accent-bg: rgba(192,138,90,.16);
    --bg-grad: radial-gradient(1200px 600px at 80% -10%, #2a201a 0%, var(--bg) 55%);
    --header-bg: rgba(28,22,19,.65); --scroll: rgba(179,157,136,.32); --scroll-hover: rgba(179,157,136,.55);
    --shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.55 -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    background: var(--bg-grad); color: var(--fg); transition: background .25s, color .25s; }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; }

  /* 滚动条:轨道透明,只留半透明滑块 */
  * { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px;
    border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  header { padding: 16px 26px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border); background: var(--header-bg); backdrop-filter: blur(8px); }
  .logo { width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: var(--shadow); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { margin-left: auto; }

  .wrap { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 59px); }
  .sidebar { padding: 16px 14px; overflow-y: auto; border-right: 1px solid var(--border); }
  .group-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 16px 6px 9px; display: flex; align-items: center; gap: 7px; }
  .group-title:first-child { margin-top: 2px; }
  .group-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .group-title.danger .dot { background: var(--danger); }

  button.task { display: block; width: 100%; text-align: left; padding: 12px 13px; margin-bottom: 9px;
    background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 12px;
    cursor: pointer; transition: transform .08s, border-color .15s, background .15s; }
  button.task:hover { border-color: var(--border2); transform: translateY(-1px); }
  button.task.sel { border-color: var(--accent); background: var(--panel2);
    box-shadow: 0 0 0 1px var(--accent) inset, var(--shadow); }
  button.task.danger.sel { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger) inset, var(--shadow); }
  button.task .label { font-weight: 650; display: flex; align-items: center; gap: 7px; }
  button.task .tag { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
    background: var(--ok-bg); color: var(--ok); }
  button.task.danger .tag { background: var(--danger-bg); color: var(--danger); }
  button.task .desc { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.45; }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .detail { margin: 16px 18px 0; padding: 16px 18px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow); }
  .detail .empty { color: var(--muted); }
  .detail .d-top { display: flex; align-items: flex-start; gap: 14px; }
  .detail h2 { font-size: 16px; margin: 0 0 4px; }
  .detail .d-desc { color: var(--muted); font-size: 13px; }
  .detail .d-cmd { margin-top: 11px; padding: 9px 12px; border-radius: 9px; background: var(--bg2);
    border: 1px solid var(--border); color: var(--fg); font-size: 12px; word-break: break-all; }
  .detail .d-purpose { margin-top: 9px; padding: 10px 13px; border-radius: 10px; font-size: 13px; line-height: 1.55;
    background: var(--accent-bg); border: 1px solid var(--border2); color: var(--fg); }
  .detail .d-purpose b { color: var(--accent); }

  /* 概览（未选任务时的默认视图，讲清整套测评思路） */
  .ov h2 { font-size: 17px; margin: 0 0 6px; }
  .ov .lead { color: var(--muted); font-size: 13px; margin-bottom: 16px; max-width: 760px; }
  .ov .lead b { color: var(--fg); }
  .ov .steps { display: grid; gap: 10px; }
  .ov .step { display: flex; gap: 12px; padding: 12px 14px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 12px; }
  .ov .step .n { flex: none; width: 24px; height: 24px; border-radius: 7px; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .ov .step.danger .n { background: linear-gradient(135deg, var(--danger), var(--warn)); }
  .ov .step .s-name { font-weight: 650; }
  .ov .step .s-name .tag { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px; margin-left: 7px;
    background: var(--ok-bg); color: var(--ok); }
  .ov .step.danger .s-name .tag { background: var(--danger-bg); color: var(--danger); }
  .ov .step .s-purpose { color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.5; }
  .ov .tip { margin-top: 14px; font-size: 12.5px; color: var(--muted); }
  .ov .tip b { color: var(--accent); }
  .run-col { margin-left: auto; flex: none; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .btn-run { padding: 11px 22px; border: none; border-radius: 11px; cursor: pointer; font-size: 14px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: var(--shadow);
    transition: filter .12s, transform .08s; white-space: nowrap; }
  .btn-run:hover { filter: brightness(1.08); }
  .btn-run:active { transform: translateY(1px); }
  .btn-run:disabled { filter: grayscale(.6) brightness(.7); cursor: not-allowed; }
  .danger-note { font-size: 11px; color: var(--danger); text-align: center; }

  .tabs { display: flex; gap: 4px; padding: 14px 18px 0; align-items: center; }
  .tab { padding: 7px 14px; border-radius: 9px 9px 0 0; cursor: pointer; font-size: 13px; color: var(--muted);
    border: 1px solid transparent; border-bottom: none; }
  .tab.active { color: var(--fg); background: var(--panel); border-color: var(--border); }
  .tab .count { font-size: 10px; color: var(--muted); margin-left: 4px; }
  .tab-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 12px; padding: 4px 11px; border-radius: 20px; background: var(--panel);
    border: 1px solid var(--border); color: var(--muted); }
  .badge.running { color: var(--warn); border-color: var(--warn); }
  .badge.running::before { content: "●"; margin-right: 5px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.fail { color: var(--fail); border-color: var(--fail); }
  .mini { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
    color: var(--fg); cursor: pointer; font-size: 12px; }
  .mini:hover { border-color: var(--accent); }
  .mini:disabled { opacity: .45; cursor: not-allowed; }

  .panes { flex: 1; margin: 0 18px 18px; min-height: 0; display: flex; }
  .pane { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 0 12px 12px 12px; overflow: auto; }
  .pane.hidden { display: none; }
  pre#out { margin: 0; padding: 16px 18px; white-space: pre-wrap; word-break: break-word; font-size: 12.5px;
    color: var(--fg); }
  pre#out .err { color: var(--fail); }
  pre#out .hint { color: var(--muted); }

  #prompts { padding: 16px 18px; }
  .pblock { margin-bottom: 22px; }
  .pblock h3 { font-size: 14px; margin: 0 0 4px; }
  .pblock .pdesc { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .scn { border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 9px; background: var(--bg2); }
  .scn .scn-id { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-bg);
    padding: 2px 8px; border-radius: 20px; }
  .scn .scn-prompt { font-size: 14px; margin: 8px 0 0; color: var(--fg); }
  .scn .scn-meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  details.tmpl { margin-top: 6px; }
  details.tmpl summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  details.tmpl summary:hover { color: var(--fg); }
  pre.tmpl-body { margin: 8px 0 0; padding: 12px 14px; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--fg); max-height: 360px; overflow: auto; }
  .pnone { color: var(--muted); font-size: 13px; }
</style>
<script>
  // 尽早应用主题，避免刷新时闪一下默认色。默认浅色暖咖。
  (function () {
    try { var t = localStorage.getItem('eval-theme'); if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  })();
</script>
</head>
<body>
<header>
  <span class="logo"></span>
  <h1>OpenYida Eval 控制台</h1>
  <span class="meta" id="env">加载中…</span>
  <span class="spacer"></span>
  <button class="mini" id="theme-btn" title="切换明暗">🌙 深色</button>
  <button class="mini" id="overview-btn">ℹ︎ 测评思路</button>
</header>
<div class="wrap">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="main">
    <div class="detail" id="detail"><span class="empty">加载中…</span></div>

    <div class="tabs">
      <div class="tab active" data-tab="output" id="tab-output">运行输出</div>
      <div class="tab" data-tab="prompts" id="tab-prompts">提示词 <span class="count" id="prompt-count"></span></div>
      <span class="tab-actions">
        <span class="badge" id="status">空闲</span>
        <button class="mini" id="report">📊 最新报告</button>
        <button class="mini" id="stop" disabled>停止</button>
        <button class="mini" id="clear">清屏</button>
      </span>
    </div>

    <div class="panes">
      <div class="pane" id="pane-output"><pre id="out"><span class="hint">选择任务并点「运行」。危险任务（红色）会在你的宜搭组织创建一次性资源，需先 openyida login。</span></pre></div>
      <div class="pane hidden" id="pane-prompts"><div id="prompts"><span class="pnone">选择一个任务查看它使用的提示词。</span></div></div>
    </div>
  </section>
</div>
<script>
  const out = document.getElementById('out');
  const statusEl = document.getElementById('status');
  const stopBtn = document.getElementById('stop');
  const sidebar = document.getElementById('sidebar');
  const detail = document.getElementById('detail');
  const promptsEl = document.getElementById('prompts');
  const promptCount = document.getElementById('prompt-count');
  let es = null, runId = null, selected = null, prompts = {}, running = false, allTasks = [];

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'badge ' + (cls || ''); }
  function append(text, isErr) {
    const span = document.createElement('span');
    if (isErr) span.className = 'err';
    span.textContent = text + '\n';
    out.appendChild(span);
    out.scrollTop = out.scrollHeight;
  }
  function showTab(name) {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
    document.getElementById('pane-output').classList.toggle('hidden', name !== 'output');
    document.getElementById('pane-prompts').classList.toggle('hidden', name !== 'prompts');
  }

  function renderOverview() {
    let steps = '';
    allTasks.forEach((t, i) => {
      steps += '<div class="step' + (t.danger ? ' danger' : '') + '">'
        + '<div class="n">' + (i + 1) + '</div>'
        + '<div style="min-width:0">'
        + '<div class="s-name">' + esc(t.label)
        + (t.danger ? '<span class="tag">真实资源</span>' : '<span class="tag">无副作用</span>') + '</div>'
        + '<div class="s-purpose">' + esc(t.purpose || t.description || '') + '</div>'
        + '</div></div>';
    });
    detail.innerHTML =
      '<div class="ov">'
      + '<h2>这套控制台在测什么？</h2>'
      + '<div class="lead">openyida 技能的本事是<b>“路由 + 编排”</b>：从 ~50 个子技能里<b>选对一个</b>，'
      + '再引导 agent <b>把宜搭应用真的建出来</b>。这里的每个任务回答同一个问题的不同侧面——'
      + '<b>改了 <code>yida-skills/SKILL.md</code> 之后，技能是变好了还是变差了？</b>'
      + '按从便宜到昂贵排列，点任意任务看详情与提示词。</div>'
      + '<div class="steps">' + steps + '</div>'
      + '<div class="tip"><b>建议顺序：</b>改完技能 → 先跑「逻辑自检 / 路由测评」（快、零副作用）→ 视情况再跑「真实生成」看端到端效果；'
      + '若真实生成失败，用「工具管道基线」排查到底是 agent 还是工具的问题。</div>'
      + '</div>';
  }

  function renderDetail() {
    if (!selected) { renderOverview(); return; }
    const t = selected;
    detail.innerHTML =
      '<div class="d-top">'
      + '<div style="min-width:0">'
      + '<h2>' + esc(t.label) + (t.danger ? ' <span class="tag" style="background:var(--danger-bg);color:var(--danger)">真实资源</span>' : '') + '</h2>'
      + (t.purpose ? '<div class="d-purpose"><b>🎯 目的：</b>' + esc(t.purpose) + '</div>' : '')
      + '<div class="d-desc" style="margin-top:9px">' + esc(t.description || '') + '</div>'
      + '<div class="d-cmd mono">$ ' + esc(t.preview) + '</div>'
      + '</div>'
      + '<div class="run-col">'
      + '<button class="btn-run" id="run-btn"' + (running ? ' disabled' : '') + '>▶ 运行</button>'
      + (t.danger ? '<span class="danger-note">会创建真实宜搭资源</span>' : '')
      + '</div>'
      + '</div>';
    document.getElementById('run-btn').onclick = () => runSelected();
  }

  function renderPrompts() {
    const kinds = (selected && selected.promptKinds) || [];
    promptCount.textContent = kinds.length ? '(' + kinds.length + ')' : '';
    if (!selected) { promptsEl.innerHTML = '<span class="pnone">选择一个任务查看它使用的提示词。</span>'; return; }
    if (!kinds.length) {
      promptsEl.innerHTML = '<span class="pnone">本任务不向 agent 发送提示词（纯单测 / 确定性命令）。</span>';
      return;
    }
    let html = '';
    for (const k of kinds) {
      const p = prompts[k];
      if (!p) continue;
      html += '<div class="pblock">';
      html += '<h3>' + esc(p.title) + '</h3>';
      if (p.error) { html += '<div class="pdesc" style="color:var(--fail)">加载失败：' + esc(p.error) + '</div></div>'; continue; }
      if (p.desc) html += '<div class="pdesc">' + esc(p.desc) + '</div>';
      if (Array.isArray(p.scenarios) && p.scenarios.length) {
        for (const s of p.scenarios) {
          html += '<div class="scn"><span class="scn-id">' + esc(s.id) + '</span>'
            + '<div class="scn-prompt">「' + esc(s.prompt) + '」</div>';
          if (s.expected) html += '<div class="scn-meta">期望子技能：' + esc(s.expected) + '</div>';
          if (s.expectedFeatures) html += '<div class="scn-meta">期望特征：' + esc(JSON.stringify(s.expectedFeatures)) + '</div>';
          if (s.note) html += '<div class="scn-meta">' + esc(s.note) + '</div>';
          html += '</div>';
        }
      }
      if (p.template) {
        html += '<details class="tmpl"><summary>查看发给 agent 的完整提示词模板</summary>'
          + '<pre class="tmpl-body mono">' + esc(p.template) + '</pre></details>';
      }
      html += '</div>';
    }
    promptsEl.innerHTML = html || '<span class="pnone">无提示词。</span>';
  }

  function selectTask(t, btn) {
    selected = t;
    document.querySelectorAll('button.task').forEach((b) => b.classList.remove('sel'));
    btn.classList.add('sel');
    renderDetail();
    renderPrompts();
  }

  function disableTasks(disabled) {
    document.querySelectorAll('button.task').forEach((b) => { b.disabled = disabled; });
  }

  function runSelected() {
    if (!selected || running) return;
    const t = selected;
    if (t.danger && !confirm('该任务会在你的宜搭组织创建真实的一次性资源，确认运行？\n\n' + t.label)) return;
    if (es) es.close();
    out.innerHTML = '';
    showTab('output');
    running = true;
    setStatus('运行中', 'running');
    disableTasks(true); stopBtn.disabled = false;
    renderDetail();
    append('▶ ' + t.label);

    es = new EventSource('/run?task=' + encodeURIComponent(t.id));
    es.addEventListener('meta', (e) => { const m = JSON.parse(e.data); runId = m.runId; append('$ ' + m.cmd + '\n'); });
    es.addEventListener('log', (e) => append(e.data));
    es.addEventListener('done', (e) => {
      const code = JSON.parse(e.data).code;
      append('\n— 退出码 ' + code + ' —');
      setStatus(code === 0 ? '通过' : '失败 (code ' + code + ')', code === 0 ? 'ok' : 'fail');
      finish();
    });
    es.onerror = () => { append('\n[连接中断]', true); setStatus('中断', 'fail'); finish(); };
  }
  function finish() { if (es) es.close(); es = null; runId = null; running = false; disableTasks(false); stopBtn.disabled = true; renderDetail(); }

  function showOverview() {
    selected = null;
    document.querySelectorAll('button.task').forEach((b) => b.classList.remove('sel'));
    renderDetail();
    renderPrompts();
  }

  const themeBtn = document.getElementById('theme-btn');
  function applyTheme(theme) {
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = theme === 'dark' ? '☀️ 浅色' : '🌙 深色';
    try { localStorage.setItem('eval-theme', theme); } catch (e) {}
  }
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  themeBtn.onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

  stopBtn.onclick = () => { if (runId) fetch('/stop?id=' + encodeURIComponent(runId)); append('\n[已请求停止]', true); };
  document.getElementById('clear').onclick = () => { out.innerHTML = ''; };
  document.getElementById('report').onclick = () => { window.open('/report', '_blank'); };
  document.getElementById('overview-btn').onclick = () => showOverview();
  document.querySelectorAll('.tab').forEach((tab) => { tab.onclick = () => showTab(tab.dataset.tab); });

  Promise.all([
    fetch('/info').then((r) => r.json()),
    fetch('/prompts').then((r) => r.json()).catch(() => ({})),
  ]).then(([info, p]) => {
    prompts = p || {};
    allTasks = info.tasks || [];
    document.getElementById('env').textContent = 'Node ' + info.node + ' · ' + info.cwd;
    const groups = { safe: ['安全任务 · 无副作用', false], danger: ['真实链路 · 会创建资源', true] };
    ['safe', 'danger'].forEach((g) => {
      const items = info.tasks.filter((t) => t.group === g);
      if (!items.length) return;
      const title = document.createElement('div');
      title.className = 'group-title' + (g === 'danger' ? ' danger' : '');
      title.innerHTML = '<span class="dot"></span>' + groups[g][0];
      sidebar.appendChild(title);
      items.forEach((t) => {
        const btn = document.createElement('button');
        btn.className = 'task' + (t.danger ? ' danger' : '');
        btn.innerHTML = '<span class="label">' + esc(t.label)
          + (t.danger ? '<span class="tag">真实资源</span>' : '') + '</span>'
          + '<span class="desc">' + esc(t.description || '') + '</span>';
        btn.onclick = () => selectTask(t, btn);
        sidebar.appendChild(btn);
      });
    });
    renderDetail();
  });
</script>
</body>
</html>
